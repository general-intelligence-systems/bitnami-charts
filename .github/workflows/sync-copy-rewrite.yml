name: Sync and Rewrite Charts

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sync-and-rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Sync main with upstream
        run: gh repo sync general-intelligence-systems/bitnami-charts --branch main
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Checkout where-the-magic-happens
        uses: actions/checkout@v4
        with:
          ref: where-the-magic-happens
          fetch-depth: 0

      - name: Fetch main branch
        run: git fetch origin main

      - name: Delete existing bitnami folder
        run: rm -rf bitnami

      - name: Copy bitnami folder from main
        run: git checkout origin/main -- bitnami

      - name: Rewrite all bitnami references to GHCR
        run: |
          find bitnami -type f ! -path '*/.git/*' -exec sed -i \
            -e 's|registry: docker.io|registry: ghcr.io|g' \
            -e 's|repository: bitnami/|repository: general-intelligence-systems/|g' \
            -e 's|docker.io/bitnami/|ghcr.io/general-intelligence-systems/|g' \
            -e 's|oci://registry-1.docker.io/bitnamicharts|oci://ghcr.io/general-intelligence-systems/bitnami-charts|g' \
            -e 's|https://bitnami.com|https://github.com/general-intelligence-systems/bitnami-charts|g' \
            -e 's|https://github.com/bitnami/charts|https://github.com/general-intelligence-systems/bitnami-charts|g' \
            {} +

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Sync charts from main and rewrite to ghcr.io/general-intelligence-systems"
          git push origin where-the-magic-happens
