name: Release Charts

on:
  workflow_run:
    workflows: ["Sync and Rewrite Charts"]
    types: [completed]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Detect which charts have new versions not yet published to OCI
  # ---------------------------------------------------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      matrix: ${{ steps.changed.outputs.matrix }}
      has_changes: ${{ steps.changed.outputs.has_changes }}
    steps:
      - name: Checkout where-the-magic-happens
        uses: actions/checkout@v4
        with:
          ref: where-the-magic-happens

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Detect unpublished chart versions
        id: changed
        run: |
          charts=()
          for chart_yaml in bitnami/*/Chart.yaml; do
            chart_dir="$(dirname "$chart_yaml")"
            chart_name="$(basename "$chart_dir")"
            chart_version="$(grep '^version:' "$chart_yaml" | awk '{print $2}')"

            # Check if this exact version already exists in the OCI registry
            if helm show chart "oci://ghcr.io/general-intelligence-systems/bitnami-charts/$chart_name" \
                 --version "$chart_version" > /dev/null 2>&1; then
              echo "SKIP $chart_name:$chart_version (already published)"
            else
              echo "NEW  $chart_name:$chart_version"
              charts+=("$chart_name")
            fi
          done

          if [ ${#charts[@]} -eq 0 ]; then
            echo "No charts to release"
            echo 'matrix={"chart":[]}' >> "$GITHUB_OUTPUT"
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
          else
            # Build JSON matrix
            json=$(printf '%s\n' "${charts[@]}" | jq -R . | jq -sc '{"chart": .}')
            echo "matrix=$json" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Charts to release: ${charts[*]}"
          fi

  # ---------------------------------------------------------------------------
  # Job 2: Package each changed chart, push OCI, create GitHub Release
  # ---------------------------------------------------------------------------
  package:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.has_changes == 'true' }}
    permissions:
      contents: write
      packages: write
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
      max-parallel: 10
    steps:
      - name: Checkout where-the-magic-happens
        uses: actions/checkout@v4
        with:
          ref: where-the-magic-happens

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build dependencies
        run: |
          chart_dir="bitnami/${{ matrix.chart }}"
          if [ -f "$chart_dir/Chart.lock" ]; then
            rm -f "$chart_dir/Chart.lock"
          fi
          helm dependency update "$chart_dir"

      - name: Package chart
        id: pkg
        run: |
          helm package "bitnami/${{ matrix.chart }}" -d .cr-release-packages
          tgz=$(ls .cr-release-packages/*.tgz)
          tgz_name=$(basename "$tgz")
          chart_version="$(grep '^version:' "bitnami/${{ matrix.chart }}/Chart.yaml" | awk '{print $2}')"
          tag="${{ matrix.chart }}-${chart_version}"
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"
          echo "tgz_name=$tgz_name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$chart_version" >> "$GITHUB_OUTPUT"
          echo "Packaged: $tgz (tag: $tag)"

      - name: Push OCI package to GHCR
        run: helm push "${{ steps.pkg.outputs.tgz }}" oci://ghcr.io/general-intelligence-systems/bitnami-charts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.pkg.outputs.tag }}"
          tgz="${{ steps.pkg.outputs.tgz }}"

          # Delete existing release/tag if it exists (idempotent)
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true

          # Create release with the .tgz attached
          gh release create "$tag" "$tgz" \
            --title "${{ matrix.chart }} ${{ steps.pkg.outputs.version }}" \
            --notes "Helm chart \`${{ matrix.chart }}\` version \`${{ steps.pkg.outputs.version }}\`

          Install via OCI:
          \`\`\`
          helm install ${{ matrix.chart }} oci://ghcr.io/general-intelligence-systems/bitnami-charts/${{ matrix.chart }} --version ${{ steps.pkg.outputs.version }}
          \`\`\`

          Install via Helm repo:
          \`\`\`
          helm repo add gis https://general-intelligence-systems.github.io/bitnami-charts
          helm install ${{ matrix.chart }} gis/${{ matrix.chart }} --version ${{ steps.pkg.outputs.version }}
          \`\`\`"

  # ---------------------------------------------------------------------------
  # Job 3: Rebuild index.yaml on gh-pages pointing to GitHub Release assets
  # ---------------------------------------------------------------------------
  update-index:
    runs-on: ubuntu-latest
    needs: package
    if: ${{ always() && needs.package.result != 'cancelled' }}
    permissions:
      contents: write
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Sync index.yaml with all GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p staging

          # Ensure index.yaml exists
          if [ ! -f index.yaml ]; then
            printf 'apiVersion: v1\nentries: {}\ngenerated: "1970-01-01T00:00:00Z"\n' > index.yaml
          fi

          # List all GitHub Releases and index any missing ones
          gh release list --limit 1000 --json tagName -q '.[].tagName' | while read -r tag; do
            # Skip if already in the index
            if grep -q "${tag}.tgz" index.yaml 2>/dev/null; then
              echo "SKIP $tag (already indexed)"
              continue
            fi

            release_url="https://github.com/general-intelligence-systems/bitnami-charts/releases/download/${tag}"

            echo "Indexing $tag ..."
            if gh release download "$tag" --pattern "*.tgz" --dir "staging/${tag}" 2>/dev/null; then
              helm repo index "staging/${tag}" \
                --url "$release_url" \
                --merge index.yaml
              mv "staging/${tag}/index.yaml" index.yaml
              echo "INDEXED $tag"
            else
              echo "WARN $tag: no .tgz asset found"
            fi
          done

          rm -rf staging

      - name: Commit and push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update Helm repo index"
          git push origin gh-pages
