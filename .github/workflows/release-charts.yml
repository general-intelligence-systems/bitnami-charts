name: Release Charts

on:
  workflow_run:
    workflows: ["Sync and Rewrite Charts"]
    types: [completed]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Checkout where-the-magic-happens
        uses: actions/checkout@v4
        with:
          ref: where-the-magic-happens
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Add bitnami dependency repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Build chart dependencies
        run: |
          for chart in bitnami/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              helm dependency build "$chart" || true
            fi
          done

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: bitnami
          skip_existing: true
          package_with_index: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
